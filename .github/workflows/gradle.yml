name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: chmod +x gradlew 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    # Setup Gradle for caching and dependency tracking
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # Run build using the Gradle wrapper
    - name: Build with Gradle
      run: ./gradlew build

    # Optional: Run tests explicitly if not covered by build
    - name: Test with Gradle
      run: ./gradlew test
